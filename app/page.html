<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Video Generator</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <header class="header">
      <div class="logo">
        <span>AI</span> Video Generator
      </div>

      <p>
        Transforme suas ideias em vídeos usando inteligência artificial.
      </p>
    </header>

    <section class="generator">

      <label for="prompt">
        Descreva o vídeo que você deseja criar
      </label>

      <textarea
        id="prompt"
        placeholder="Ex: Uma modelo caminhando em uma loja de roupas moderna, usando um vestido preto, iluminação cinematográfica..."
      ></textarea>

      <div class="options">

        <div>
          <label for="format">Formato</label>

          <select id="format">
            <option value="9:16">9:16 — TikTok / Reels</option>
            <option value="16:9">16:9 — YouTube</option>
            <option value="1:1">1:1 — Instagram</option>
          </select>
        </div>

        <div>
          <label for="duration">Duração</label>

          <select id="duration">
            <option value="5">5 segundos</option>
            <option value="10">10 segundos</option>
            <option value="15">15 segundos</option>
          </select>
        </div>

      </div>

      <button id="generateButton">
        ✨ Gerar vídeo
      </button>

      <div id="status" class="status"></div>

      <div id="preview" class="preview">
        <div class="preview-placeholder">
          <span>🎬</span>
          <p>Seu vídeo aparecerá aqui</p>
        </div>
      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
